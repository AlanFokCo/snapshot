suite: restore proxy NRI mount
templates:
  - templates/daemonset.yaml
tests:
  # The directory, not the socket: a socket-typed hostPath would keep the agent
  # from starting on nodes where the runtime has NRI turned off.
  - it: mounts the NRI socket directory
    asserts:
      - contains:
          path: spec.template.spec.containers[?(@.name == "agent")].volumeMounts
          content:
            name: nri
            mountPath: /var/run/nri
      - contains:
          path: spec.template.spec.volumes
          content:
            name: nri
            hostPath:
              path: /var/run/nri
              type: DirectoryOrCreate
